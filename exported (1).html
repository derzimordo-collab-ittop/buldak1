<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buldak: Fire Noodles</title>
    <style>
        /* Полный сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Эффект летящих искр и перца на фоне */
        .fire-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="40" fill="%23ff6600" opacity="0.1"/><path d="M50 10 L60 40 L40 30 Z" fill="%23ff4500" opacity="0.1"/></svg>');
            background-size: 50px 50px;
            z-index: -1;
            animation: float 15s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 50px) rotate(180deg); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 3px solid #ff4500;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff4500, #ff6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .buldak-img {
            width: 300px;
            max-width: 100%;
            border-radius: 15px;
            border: 5px solid #ff4500;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .buldak-img:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 20px 40px rgba(255, 69, 0, 0.5);
        }

        .spicy-meter {
            margin: 30px 0;
            text-align: left;
            background: #f0f0f0;
            border-radius: 25px;
            padding: 15px;
            border: 2px solid #ff4500;
        }

        .meter-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .bar {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            width: 95%;
            height: 100%;
            background: linear-gradient(90deg, #ff4500, #ff6600);
            border-radius: 25px;
            animation: spicy 2s ease-in-out infinite;
        }

        @keyframes spicy {
            0%, 100% { width: 95%; }
            50% { width: 100%; }
        }

        .warning {
            margin-top: 20px;
            font-size: 1.1em;
            color: #ff4500;
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1em;
            font-weight: bold;
            color: white;
            background: #ff4500;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #ff6600;
        }
    </style>
</head>
<body>

<div class="fire-bg"></div>

<div class="container">
    <h1>Buldak Bokkeummyun</h1>
    <div class="subtitle">2X Spicy Hot Chicken Flavor Ramen</div>
    
    <!-- Ссылка на вашу картинку с пачкой лапши -->
    <img src="image.jpeg" alt="Пачка лапши Buldak" class="buldak-img">
    
    <div class="spicy-meter">
        <div class="meter-title">Уровень остроты (Шкала Сковилла)</div>
        <div class="bar">
            <div class="bar-fill"></div>
        </div>
        <div style="text-align: right; font-size: 0.9em; color: #666; margin-top: 5px;">10,000+ SHU</div>
    </div>

    <div class="warning">♨️ Осторожно: может вызвать пот, слезы и экзистенциальный кризис ♨️</div>
    
    <button onclick="alert('Глаза уже наливаются кровью!')">Я готов сжечь свои рецепторы</button>
</div>

</body>
</html>
